; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini
; native is test-only (`pio test -e native`) and has no main() to link as a
; firmware image -- excluded here so a plain `pio run` builds the device only.
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32@6.13.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
board = seeed_xiao_esp32s3
framework = arduino

lib_deps =
    https://github.com/sorasen2020/SwitchControllerESP32.git#7d493e6b189490f48c9d739ac0559011d4a1c42a
    https://github.com/eclipse-zenoh/zenoh-pico.git#1.10.0
    bblanchon/ArduinoJson@^7
lib_ldf_mode = deep+
lib_ignore = FreeRTOS

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    ${secrets.build_flags}
build_unflags = -std=gnu++11

monitor_speed = 115200
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_deps = bblanchon/ArduinoJson@^7
test_build_src = yes
build_src_filter = +<command_parser.cpp> +<executor.cpp> +<state_hold.cpp>
