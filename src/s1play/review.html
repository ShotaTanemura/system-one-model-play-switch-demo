<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label review</title>
<style>
  :root {
    --bg: #fafafa; --fg: #1b1b1b; --muted: #666; --card: #fff; --line: #d8d8d8;
    --yes: #1f7a3d; --yes-bg: #e3f4e8; --warn: #9a5b00; --warn-bg: #fff1d6; --accent: #0b5fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515; --fg: #ececec; --muted: #999; --card: #1f1f1f; --line: #333;
      --yes: #6fd48d; --yes-bg: #17301f; --warn: #f0b45a; --warn-bg: #352708; --accent: #6b9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--card); }
  header .count { margin-left: auto; color: var(--muted); }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .left { flex: 1 1 520px; max-width: 1040px; }
  .right { flex: 1 1 340px; max-width: 520px; }
  #shot { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); background: #000; }
  .neighbors { display: flex; gap: 8px; margin-top: 8px; }
  .neighbors figure { margin: 0; flex: 1; }
  .neighbors img { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); background: #000; }
  .neighbors figcaption { color: var(--muted); font-size: 12px; }
  .meta { color: var(--muted); font-size: 12px; margin: 6px 0; word-break: break-all; }
  .q { display: flex; gap: 8px; width: 100%; text-align: left; padding: 7px 9px; margin: 0 0 5px;
       border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--fg);
       cursor: pointer; font: inherit; }
  .q.on { background: var(--yes-bg); border-color: var(--yes); }
  .q .k { color: var(--muted); min-width: 1.2em; }
  .q .id { font-weight: 600; min-width: 11em; }
  .q.on .id { color: var(--yes); }
  .q .txt { color: var(--muted); font-size: 12px; }
  .q.dead.on { background: var(--warn-bg); border-color: var(--warn); }
  .q.dead.on .id { color: var(--warn); }
  .action { font-size: 18px; font-weight: 700; margin: 10px 0; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 8px; }
  .badge.rev { background: var(--yes-bg); color: var(--yes); }
  .badge.unrev { background: var(--warn-bg); color: var(--warn); }
  textarea { width: 100%; height: 70px; border: 1px solid var(--line); border-radius: 6px; padding: 6px;
             background: var(--card); color: var(--fg); font: inherit; }
  button.nav, select { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px;
                       background: var(--card); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .keys { color: var(--muted); font-size: 12px; margin-top: 12px; }
  #err { color: #c62828; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <label>Show
    <select id="filter">
      <option value="all">all frames</option>
      <option value="unreviewed">not reviewed</option>
      <option value="audit">audit sample (10%)</option>
      <option value="audit-unreviewed">audit sample, not reviewed</option>
      <option value="unsure">unsure</option>
      <option value="unsure-unreviewed">unsure, not reviewed</option>
    </select>
  </label>
  <button class="nav" id="prev">&larr; prev</button>
  <span id="pos"></span>
  <button class="nav" id="next">next &rarr;</button>
  <span class="count" id="count"></span>
</header>
<main>
  <div class="left">
    <img id="shot" alt="current frame">
    <div class="neighbors">
      <figure><img id="before" alt=""><figcaption id="before-cap"></figcaption></figure>
      <figure><img id="after" alt=""><figcaption id="after-cap"></figcaption></figure>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="right">
    <div id="questions"></div>
    <button class="q dead" id="dead"><span class="k">d</span><span class="id">dead</span>
      <span class="txt">Mario is in the death animation or off screen. No input has an effect.</span></button>
    <div class="action">action: <span id="action"></span><span class="badge" id="badge"></span></div>
    <textarea id="note" placeholder="note"></textarea>
    <p><button class="nav primary" id="done">Reviewed, next (Enter)</button></p>
    <div id="err"></div>
    <div class="keys">&larr; &rarr; move &nbsp; 1-9 toggle a question &nbsp; d dead &nbsp; Enter reviewed and next</div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let data = null, order = [], at = 0;

async function load() {
  data = await (await fetch("/api/state")).json();
  render(true);
}

function inFilter(row) {
  const f = $("filter").value;
  const audit = data.audit.includes(row.frame);
  const unsure = row.note.startsWith("unsure:");
  return {
    all: true,
    unreviewed: !row.reviewed,
    audit,
    "audit-unreviewed": audit && !row.reviewed,
    unsure,
    "unsure-unreviewed": unsure && !row.reviewed,
  }[f];
}

function current() { return order.length ? data.rows.find((r) => r.frame === order[at]) : null; }

function render(rebuild) {
  if (rebuild) {
    const keep = order[at];
    order = data.rows.filter(inFilter).map((r) => r.frame);
    const same = order.indexOf(keep);
    if (same >= 0) at = same;
    at = Math.min(at, Math.max(0, order.length - 1));
  }
  const done = data.rows.filter((r) => r.reviewed).length;
  $("count").textContent = `reviewed ${done} / ${data.rows.length}`;
  const row = current();
  $("pos").textContent = order.length ? `${at + 1} / ${order.length}` : "0 / 0";
  if (!row) { $("meta").textContent = "No frames in this filter."; return; }

  $("shot").src = "/bench/" + row.frame;
  const pad = (n) => String(n).padStart(6, "0");
  for (const [id, d] of [["before", -1], ["after", 1]]) {
    const step = row.step + d;
    $(id).src = `/run/${row.run}/${pad(step)}.jpg`;
    $(id).style.visibility = "visible";
    $(id).onerror = () => { $(id).style.visibility = "hidden"; };
    $(id + "-cap").textContent = `step ${step}`;
  }
  $("meta").textContent = `${row.frame}  (run ${row.run}, step ${row.step})`;

  const box = $("questions");
  box.innerHTML = "";
  Object.keys(row.labels).forEach((qid, i) => {
    const b = document.createElement("button");
    b.className = "q" + (row.labels[qid] ? " on" : "");
    b.innerHTML = `<span class="k">${i + 1}</span><span class="id">${qid}</span><span class="txt"></span>`;
    b.querySelector(".txt").textContent = data.questions[qid];
    b.onclick = () => edit({ labels: { [qid]: !row.labels[qid] } });
    box.appendChild(b);
  });
  $("dead").className = "q dead" + (row.dead ? " on" : "");
  $("action").textContent = row.action;
  $("badge").textContent = row.reviewed ? "reviewed" : "not reviewed";
  $("badge").className = "badge " + (row.reviewed ? "rev" : "unrev");
  if (document.activeElement !== $("note")) $("note").value = row.note;
}

async function edit(change) {
  const row = current();
  if (!row) return;
  $("err").textContent = "";
  const res = await fetch("/api/edit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ frame: row.frame, edit: change }),
  });
  const body = await res.json();
  if (!res.ok) { $("err").textContent = body.error; return; }
  Object.assign(row, body);
  render(false);
}

function go(delta) {
  if (!order.length) return;
  at = Math.min(order.length - 1, Math.max(0, at + delta));
  $("note").blur();
  render(false);
}

async function reviewAndNext() {
  await edit({ reviewed: true });
  if ($("filter").value.endsWith("unreviewed") || $("filter").value === "unreviewed") {
    render(true);
  } else {
    go(1);
  }
}

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("done").onclick = reviewAndNext;
$("dead").onclick = () => { const r = current(); if (r) edit({ dead: !r.dead }); };
$("filter").onchange = () => render(true);
$("note").onchange = () => edit({ note: $("note").value });

document.addEventListener("keydown", (e) => {
  if (e.target === $("note") || e.metaKey || e.ctrlKey || e.altKey) return;
  const row = current();
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Enter") reviewAndNext();
  else if (e.key === "d" && row) edit({ dead: !row.dead });
  else if (/^[1-9]$/.test(e.key) && row) {
    const qid = Object.keys(row.labels)[Number(e.key) - 1];
    if (qid) edit({ labels: { [qid]: !row.labels[qid] } });
  } else return;
  e.preventDefault();
});

load();
</script>
</body>
</html>
