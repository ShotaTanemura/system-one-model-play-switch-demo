[project]
name = "s1play"
version = "0.1.0"
description = "Let a System One model (Jev, Clef-omni) play Switch games via OBS frames and an ESP32 controller"
requires-python = ">=3.13"
dependencies = [
    "eclipse-zenoh>=1.0",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "obsws-python>=1.7",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1play"]

[tool.ruff]
line-length = 100
